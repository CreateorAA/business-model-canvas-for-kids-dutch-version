<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Startup Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: bordspel-wereld. Dikke inktranden, harde schaduwen, plakbriefjes op het canvas; kaart met 5 levels als startscherm. */
:root{
  --bg:#D8EEFF; --dot:#B9DCFA; --surface:#FFFFFF; --surface-2:#F1F7FF;
  --ink:#1A1D3A; --muted:#545B82; --line:#1A1D3A; --shadow:#1A1D3A;
  --tomato:#FF5B3A; --sun:#FFC83D; --mint:#2CCB86; --sky:#3E95FF;
  --klant:#FF8A6B; --achter:#7DB8FF; --geld:#5FDDA5;
  --note-klant:#FFD3C4; --note-achter:#CFE5FF; --note-geld:#C9F5DF; --note-ink:#1A1D3A;
  --good:#18A86B; --bad:#E2412A;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141733; --dot:#1E2247; --surface:#212650; --surface-2:#1A1E42;
  --ink:#F1F2FF; --muted:#AAB0DA; --line:#0A0C1F; --shadow:#05060F;
  --klant:#FF7A57; --achter:#5C9EF5; --geld:#3FC98D;
  --good:#3EDB95; --bad:#FF6B52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141733; --dot:#1E2247; --surface:#212650; --surface-2:#1A1E42;
  --ink:#F1F2FF; --muted:#AAB0DA; --line:#0A0C1F; --shadow:#05060F;
  --klant:#FF7A57; --achter:#5C9EF5; --geld:#3FC98D;
  --good:#3EDB95; --bad:#FF6B52; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto}

/* knoppen */
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:14px;background:var(--sun);color:var(--note-ink);font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em;padding:9px 16px;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.red{background:var(--tomato);color:#fff}
.btn.green{background:var(--mint)}
.btn.sm{font-size:.92rem;padding:6px 12px;box-shadow:3px 3px 0 var(--shadow)}

/* topbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1120px;margin:12px auto 24px;padding:10px 14px;background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow)}
.logo{border:0;background:none;cursor:pointer;font-family:var(--f-display);font-size:1.55rem;padding:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--tomato);border:3px solid var(--line);display:grid;place-items:center;transform:rotate(-6deg)}
.logo .mark svg{width:18px;height:18px;stroke:#fff}
.logo span.q{color:var(--tomato)}
.xp{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px;justify-content:flex-end}
.rank{font-family:var(--f-display);font-size:1rem;background:var(--sky);color:#fff;border:3px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
.bar{flex:1;max-width:240px;height:18px;border:3px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,#FFB01F 10px 20px);transition:width .5s cubic-bezier(.3,1.5,.6,1)}
.xpnum{font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1rem}

/* startscherm */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:34px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem)}
.hero h1 em{font-style:normal;color:var(--tomato);display:inline-block;transform:rotate(-2deg)}
.hero p.lead{margin-top:14px;font-size:1.08rem;max-width:52ch;color:var(--muted)}
.ticket{background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);padding:20px;transform:rotate(1.5deg)}
.ticket h3{font-size:1.5rem}
.ticket .big{font-family:var(--f-display);font-size:3rem;line-height:1;color:var(--tomato);font-variant-numeric:tabular-nums}
.ticket .row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:10px}
.ticket small{color:var(--muted)}
.ranks{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.ranks span{font-size:.75rem;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.ranks span.on{background:var(--sun);color:var(--note-ink)}

.map{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;position:relative}
.map::before{content:"";position:absolute;left:8%;right:8%;top:58px;border-top:5px dashed var(--line);opacity:.35;z-index:0}
.map li{position:relative;z-index:1}
.map li:nth-child(even){margin-top:46px}
.node{width:100%;text-align:left;cursor:pointer;background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .12s}
.node:hover{transform:translateY(-4px) rotate(-1deg)}
.node .disc{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--c,var(--sun));position:relative}
.node .disc svg{width:30px;height:30px;stroke:var(--note-ink)}
.node .num{position:absolute;top:-8px;right:-10px;background:var(--surface);border:3px solid var(--line);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem}
.node h3{font-size:1.3rem}
.node p{font-size:.9rem;color:var(--muted)}
.pill{align-self:flex-start;font-size:.78rem;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.pill.done{background:var(--mint);color:var(--note-ink)}

/* levelpagina */
.lvhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lvhead .disc{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--c);flex:none}
.lvhead .disc svg{width:28px;height:28px;stroke:var(--note-ink)}
.lvhead h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.lvhead .eyebrow{margin:0 0 2px}
.lvhead .grow{flex:1;min-width:0}
.intro{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;box-shadow:4px 4px 0 var(--shadow);max-width:780px}
.intro b{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:3px solid var(--line);border-radius:999px;background:var(--surface);padding:6px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .ok{width:18px;height:18px;border-radius:50%;background:var(--mint);border:2px solid var(--line);display:grid;place-items:center}
.chip .ok svg{width:10px;height:10px;stroke:var(--note-ink)}

/* het canvas */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;font-weight:700;margin-bottom:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line)}
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-areas:"pa pa ac ac wa wa re re kl kl" "pa pa mi mi wa wa ka ka kl kl" "ko ko ko ko ko in in in in in";gap:10px}
.blk{grid-area:var(--a);background:var(--surface);border:3px solid var(--line);border-radius:var(--r);min-height:150px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.blk:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow)}
.blk.target{outline:4px dashed var(--tomato);outline-offset:2px}
.blk.shake{animation:shake .4s}
.blk.pop{animation:pop .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{40%{transform:scale(1.05)}}
.blk .hd{background:var(--g);color:var(--note-ink);padding:6px 10px;border-bottom:3px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
.blk .hd b{font-family:var(--f-display);font-weight:400;font-size:1.02rem;letter-spacing:.02em}
.blk .hd .cnt{font-size:.72rem;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.blk .bd{padding:8px 10px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.blk .qq{font-size:.82rem;color:var(--muted);font-weight:500}
.blk .add{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.blk[data-g="klant"]{--g:var(--klant);--n:var(--note-klant)}
.blk[data-g="achter"]{--g:var(--achter);--n:var(--note-achter)}
.blk[data-g="geld"]{--g:var(--geld);--n:var(--note-geld)}
.blk[data-g="geld"]{min-height:110px}
.note{background:var(--n);color:var(--note-ink);border:2px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.84rem;line-height:1.35;box-shadow:2px 2px 0 var(--shadow);transform:rotate(var(--rot,-1deg));overflow-wrap:anywhere}
.note:nth-child(3n){--rot:1.2deg}.note:nth-child(3n+1){--rot:-.6deg}
.blk[data-g="geld"] .bd{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
.blk[data-g="geld"] .qq,.blk[data-g="geld"] .add{flex-basis:100%}

/* level 1: kaartjes */
.tray{margin-top:18px;background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:4px 4px 0 var(--shadow)}
.tray h3{font-size:1.15rem;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{border:3px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;text-align:left;cursor:pointer;font-size:.9rem;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s}
.card:hover{transform:rotate(-1.5deg)}
.card[aria-pressed="true"]{background:var(--sun);color:var(--note-ink);transform:translateY(-4px) rotate(-2deg);box-shadow:5px 7px 0 var(--shadow)}
.feedback{margin-top:12px;min-height:1.6em;font-weight:500}
.feedback.bad{color:var(--bad)}.feedback.good{color:var(--good)}
.win{margin-top:18px;background:var(--mint);color:var(--note-ink);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:4px 4px 0 var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.win h3{font-size:1.4rem}

/* level 2 */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun);color:var(--note-ink);border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;box-shadow:4px 4px 0 var(--shadow)}
.banner p{flex:1 1 300px}
.namebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.namebox label{font-family:var(--f-display);font-size:1.1rem}
.field{border:3px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px;min-width:0;width:100%}
.namebox .field{flex:1 1 260px;width:auto;font-weight:700;font-size:1.05rem}
.meter{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:12px;align-items:end;background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:4px 4px 0 var(--shadow)}
.meter h3{grid-column:1/-1;font-size:1.3rem}
.meter label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.meter .out{border:3px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--geld);color:var(--note-ink)}
.meter .out.neg{background:var(--tomato);color:#fff}
.meter .out b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.meter .out small{font-size:.8rem;font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.55);display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:7px 7px 0 var(--shadow);animation:rise .25s cubic-bezier(.3,1.4,.6,1)}
@keyframes rise{from{transform:translateY(30px) scale(.97);opacity:.4}}
.sheet .sh{background:var(--g);color:var(--note-ink);padding:14px 18px;border-bottom:3px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet .sh h2{font-size:1.8rem}
.sheet .sh .q{font-weight:700}
.sheet .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.x{border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.sb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.tip{background:var(--surface-2);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.tip b{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;margin-right:4px}
.elist{display:flex;flex-direction:column;gap:8px}
.elist .note{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;--rot:0deg}
.elist .note button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;width:28px;height:28px;flex:none}
.empty{color:var(--muted);font-size:.9rem}
.addform{display:flex;gap:8px}
.addform .field{flex:1}
.snav{display:flex;justify-content:space-between;gap:10px;padding:0 18px 18px;flex-wrap:wrap}

/* level 3 */
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mis{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:4px 4px 0 var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.mis.done{background:var(--surface-2)}
.mis h3{font-size:1.25rem;padding-right:90px}
.mis p{font-size:.92rem;color:var(--muted)}
.stamp{position:absolute;top:12px;right:12px;font-family:var(--f-display);font-size:.9rem;border:3px solid var(--good);color:var(--good);border-radius:10px;padding:1px 9px;transform:rotate(8deg);letter-spacing:.04em}
.tally{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tally .t{font-family:var(--f-display);font-size:1.6rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:.88rem;font-weight:500;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:2px solid var(--line)}
.safety{margin-top:16px;font-size:.88rem;color:var(--muted)}

/* level 4: patroonkaarten */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{border:3px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:5px 5px 0 var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pcard.flip{animation:flip .4s}
@keyframes flip{50%{transform:rotateY(80deg)}}
.pfront{background:var(--pc);color:var(--note-ink);padding:18px;min-height:210px;display:flex;flex-direction:column;gap:8px;position:relative}
.pfront .kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.pfront h3{font-size:1.9rem}
.pfront .shape{position:absolute;right:14px;bottom:14px;width:62px;height:62px;opacity:.9}
.pfront .brands{font-size:.88rem;font-weight:500;max-width:70%}
.pback{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.pback .rq{font-weight:700}
.pfoot{padding:0 16px 16px;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.got{font-family:var(--f-display);color:var(--good);letter-spacing:.03em}

/* level 5 */
.pitch{background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);padding:22px;max-width:760px;font-size:1.12rem;line-height:1.7}
.pitch p+p{margin-top:8px}
.pitch mark{background:var(--note-klant);color:var(--note-ink);padding:0 4px;border-radius:4px}
.pitch mark.geld{background:var(--note-geld)}.pitch mark.achter{background:var(--note-achter)}
.pitch .gap{background:transparent;border:2px dashed var(--bad);color:var(--bad);border-radius:6px;padding:0 6px;cursor:pointer;font-size:.9rem;font-weight:700}
.stage{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:20px}
.clock{font-family:var(--f-display);font-size:3.2rem;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--bg);border:3px solid var(--line);border-radius:18px;padding:4px 20px;min-width:150px;text-align:center}
.clock.hot{background:var(--tomato);color:#fff}

.back{margin-bottom:16px}
footer{max-width:1120px;margin:40px auto 0;font-size:.8rem;color:var(--muted)}
footer a{color:inherit}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em;border-radius:999px;padding:8px 20px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);animation:toast .3s cubic-bezier(.3,1.5,.6,1);white-space:nowrap}
#toast span{color:var(--sun)}
@keyframes toast{from{transform:translate(-50%,30px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

@media (max-width:900px){
  .map{grid-template-columns:repeat(2,minmax(0,1fr))}
  .map li:nth-child(even){margin-top:0}
  .map::before{display:none}
  .meter{grid-template-columns:repeat(3,minmax(0,1fr))}
  .meter .out{grid-column:1/-1}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .bmc{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"kl kl" "wa wa" "ka re" "in in" "mi ac" "pa pa" "ko ko"}
  .blk{min-height:110px}
  .missions{grid-template-columns:1fr}
  .xp{justify-content:flex-start}
}
@media (max-width:520px){
  .map{grid-template-columns:1fr}
  .meter{grid-template-columns:1fr 1fr}
  .addform{flex-direction:column}
  .overlay{place-items:end center;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">

   shape:'<rect x="6" y="6" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="5"/><rect x="34" y="6" width="22" height="22" rx="4" fill="currentColor"/><rect x="6" y="34" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="5"/><rect x="34" y="34" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="5"/>'},
  {k:'open',name:'Open',kind:'Recept 5',c:'#C9A7FF',
   line:'Laat anderen meedenken.',
   brands:'LEGO Ideas, Minecraft-mods, Wikipedia',

const LEVELS = [

  {id:'l4',t:'Geheime recepten',s:'Verzamel de 5 trucs van grote bedrijven.',icon:'cards',c:'var(--geld)'},
  {id:'l5',t:'Pitch!',s:'Vertel je plan in 60 seconden.',icon:'mega',c:'#C9A7FF'},
];
const ICONS = {
  search:'<circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',

  check:'<path d="M4 12l5 5L20 6"/>',
};
const icon = (n,sw=2.5) => `<svg viewBox="0 0 24 24" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const RANKS = [{n:'Starter',x:0},{n:'Bedenker',x:80},{n:'Bouwer',x:200},{n:'Ondernemer',x:360},{n:'Baas',x:550}];

/* ---------- staat ---------- */
const KEY = 'startup-quest-v1';
const clone = o => JSON.parse(JSON.stringify(o));
function fresh(){
  return {view:'kaart',xp:0,awarded:{},idea:'Bijles voor brugklassers',isExample:true,canvas:clone(EXAMPLE),
    money:{prijs:10,aantal:6,kosten:15},l1brand:'roblox',l1:{roblox:{},youtuber:{},spotify:{}},
    mis:{ja:0,nee:0,prijs:'',r1:'',r2:'',verras:''},pat:{},patDraft:{},practiced:false};
}
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){ S = fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- XP en feedback ---------- */
function award(key, n, msg){
  if (S.awarded[key]) return false;
  S.awarded[key] = true; S.xp += n; save(); header();
  toast(`<span>+${n} XP</span> ${esc(msg||'')}`);
  return true;
}
let toastT;
function toast(html){
  const t = document.getElementById('toast');
  t.innerHTML = html; t.hidden = false;
  t.style.animation='none'; t.offsetHeight; t.style.animation='';
  clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, 2200);
}
function header(){
  let i = RANKS.length-1; while (i>0 && S.xp < RANKS[i].x) i--;
  const cur = RANKS[i], next = RANKS[i+1];
  document.getElementById('rank').textContent = cur.n;
  const pct = next ? (S.xp-cur.x)/(next.x-cur.x)*100 : 100;
  document.getElementById('barfill').style.width = Math.min(100,pct)+'%';
  document.getElementById('bar').setAttribute('aria-valuenow', Math.round(pct));
  document.getElementById('xpnum').textContent = next ? `${S.xp} / ${next.x} XP` : `${S.xp} XP`;
}
function rankIndex(){ let i = RANKS.length-1; while (i>0 && S.xp < RANKS[i].x) i--; return i; }

/* ---------- voortgang per level ---------- */
const filled = () => ORDER.filter(k => S.canvas[k] && S.canvas[k].length).length;
function prog(id){
  if (id==='l1') return {n:Object.keys(BRANDS).filter(b=>Object.keys(S.l1[b]||{}).length===9).length,of:3,u:'merken'};
  if (id==='l2') return {n:S.isExample?0:filled(),of:9,u:'vakjes'};
  if (id==='l3') return {n:misDone().length,of:4,u:'missies'};
  if (id==='l4') return {n:Object.keys(S.pat).length,of:5,u:'kaarten'};
  return {n:S.practiced?1:0,of:1,u:'pitch'};
}
function misDone(){
  const d=[]; const m=S.mis;
  if (m.ja+m.nee>=5) d.push('interview');
  if (Number(m.prijs)>0) d.push('prijs');
  if (m.r1.trim() && m.r2.trim()) d.push('rivalen');
  if (m.verras.trim().length>=10) d.push('verras');
  return d;
}

/* ---------- weergaves ---------- */
const view = document.getElementById('view');
function render(){
  const v = S.view;
  view.innerHTML = v==='kaart' ? vMap() : lvWrap(v);
  if (v==='l2') bindMeter();
}

function vMap(){
  const ri = rankIndex();
  return `
  <section class="hero">
    <div>
      <p class="eyebrow">Voor toekomstige ondernemers van 12 tot 16</p>
      <h1>Word de <em>baas</em> van je eigen bedrijf.</h1>
      <p class="lead">Echte ondernemers tekenen hun plan op één vel met 9 vakjes: het Business Model Canvas. Hier leer je het in 5 levels. Eerst kijk je hoe grote merken het doen, daarna bouw je je eigen bedrijf.</p>
    </div>
    <div class="ticket">
      <p class="eyebrow">Jouw rang</p>
      <h3>${RANKS[ri].n}</h3>
      <div class="row"><span class="big">${S.xp}</span><small>${RANKS[ri+1] ? `nog ${RANKS[ri+1].x - S.xp} XP tot ${RANKS[ri+1].n}` : 'Hoogste rang gehaald!'}</small></div>
      <div class="ranks">${RANKS.map((r,i)=>`<span class="${i<=ri?'on':''}">${r.n}</span>`).join('')}</div>
    </div>
  </section>
  <ol class="map">
    ${LEVELS.map((L,i)=>{ const p=prog(L.id); const done=p.n>=p.of;
      return `<li><button class="node" data-act="go" data-v="${L.id}" style="--c:${L.c}">
        <span class="disc">${icon(L.icon)}<span class="num">${i+1}</span></span>
        <h3>${L.t}</h3><p>${L.s}</p>
        <span class="pill ${done?'done':''}">${done?'Gehaald':`${p.n} / ${p.of} ${p.u}`}</span>
      </button></li>`;}).join('')}
  </ol>`;
}

function lvWrap(id){
  const i = LEVELS.findIndex(l=>l.id===id), L = LEVELS[i];
  const body = {l1:vL1,l2:vL2,l3:vL3,l4:vL4,l5:vL5}[id]();
  const next = LEVELS[i+1];
  return `
  <button class="btn ghost sm back" data-act="go" data-v="kaart">&larr; Terug naar de kaart</button>
  <div class="lvhead">
    <span class="disc" style="--c:${L.c}">${icon(L.icon)}</span>
    <div class="grow"><p class="eyebrow">Level ${i+1} van 5</p><h1>${L.t}</h1></div>
    ${next ? `<button class="btn sm" data-act="go" data-v="${next.id}">Level ${i+2} &rarr;</button>` : ''}
  </div>
  ${body}`;
}

function blockHTML(k, notes, extra=''){
  const B = BLOCKS[k];
  return `<button class="blk ${extra}" style="--a:${B.a}" data-g="${B.g}" data-k="${k}" data-act="blk">
    <span class="hd"><b>${B.name}</b>${notes.length?`<span class="cnt">${notes.length}</span>`:''}</span>
    <span class="bd">
      <span class="qq">${B.q}</span>
      ${notes.map(n=>`<span class="note">${esc(n)}</span>`).join('')}
    </span></button>`;
}
const legend = () => `<div class="legend"><span><i style="background:var(--klant)"></i>Klantkant: wie, wat en hoe</span><span><i style="background:var(--achter)"></i>Achterkant: wat jij nodig hebt</span><span><i style="background:var(--geld)"></i>Geld: erin en eruit</span></div>`;

/* level 1 */
let sel = null, fb = {t:'',c:''};
const SHUF = {};
function shuffled(b){ if(!SHUF[b]){ SHUF[b]=ORDER.slice().sort(()=>Math.random()-.5); } return SHUF[b]; }
function vL1(){
  const b = S.l1brand, brand = BRANDS[b], placed = S.l1[b];
  const left = shuffled(b).filter(k=>!placed[k]);
  const done = left.length===0;
  return `
  <p class="intro"><b>Zo werkt het:</b> elk bedrijf past in dezelfde 9 vakjes. Tik op een kaartje met een weetje over het merk, en tik daarna op het vakje waar het hoort.</p>
  <div class="chips" role="group" aria-label="Kies een merk">
    ${Object.entries(BRANDS).map(([key,v])=>{ const ok=Object.keys(S.l1[key]).length===9;
      return `<button class="chip" data-act="brand" data-v="${key}" aria-pressed="${key===b}">${ok?`<span class="ok">${icon('check',4)}</span>`:''}${v.name}</button>`;}).join('')}
  </div>
  ${legend()}
  <div class="bmc">${ORDER.map(k=>blockHTML(k, placed[k]?[brand.cards[k]]:[], sel?'target':'')).join('')}</div>
  ${done ? `<div class="win"><div><h3>${brand.name} ontleed!</h3><p>Je snapt nu hoe ${brand.name} werkt. Zie je dat ze vaak twee soorten klanten hebben?</p></div>
      ${Object.keys(BRANDS).find(k=>Object.keys(S.l1[k]).length<9) ? `<button class="btn" data-act="brand" data-v="${Object.keys(BRANDS).find(k=>Object.keys(S.l1[k]).length<9)}">Volgend merk</button>` : `<button class="btn" data-act="go" data-v="l2">Nu jouw eigen idee &rarr;</button>`}</div>`
  : `<div class="tray"><h3>Kaartjes over ${brand.name} (nog ${left.length})</h3>
      <div class="cards">${left.map(k=>`<button class="card" data-act="pick" data-v="${k}" aria-pressed="${sel===k}">${esc(brand.cards[k])}</button>`).join('')}</div>
      <p class="feedback ${fb.c}" aria-live="polite">${fb.t}</p></div>`}`;
}

/* level 2 */
let resetArm = false;
function vL2(){
  const n = filled();
  return `
  ${S.isExample ? `<div class="banner"><p><b>Dit is een voorbeeld</b> van een bedrijfje dat een leerling kan starten. Kijk rond, en begin dan met je eigen idee.</p>
     ${resetArm ? `<button class="btn red" data-act="reset">Ja, maak alles leeg</button><button class="btn ghost" data-act="unarm">Nee, toch niet</button>` : `<button class="btn" data-act="arm">Start mijn eigen idee</button>`}</div>`
   : `<p class="intro"><b>Tip van echte ondernemers:</b> begin rechts bij je klanten en wat je voor ze oplost. Pas daarna kijk je naar wat je nodig hebt. Tik op een vakje om plakbriefjes toe te voegen.</p>`}
  <div class="namebox"><label for="idea">Mijn bedrijf:</label><input class="field" id="idea" data-bind="idea" maxlength="60" placeholder="Bijvoorbeeld: Sneakers customizen" value="${esc(S.idea)}"><span class="pill ${n===9&&!S.isExample?'done':''}">${n} / 9 vakjes</span></div>
  ${legend()}
  <div class="bmc">${ORDER.map(k=>blockHTML(k, S.canvas[k]||[])).join('')}</div>
  <section class="meter" aria-labelledby="mh">
    <h3 id="mh">Geldmeter: hou je iets over?</h3>
    <label for="m-prijs">Prijs per keer (€)<input class="field" type="number" min="0" step="0.5" id="m-prijs" data-m="prijs" value="${S.money.prijs}"></label>
    <label for="m-aantal">Verkopen per maand<input class="field" type="number" min="0" id="m-aantal" data-m="aantal" value="${S.money.aantal}"></label>
    <label for="m-kosten">Kosten per maand (€)<input class="field" type="number" min="0" step="0.5" id="m-kosten" data-m="kosten" value="${S.money.kosten}"></label>
    <div class="out" id="m-out"></div>
  </section>`;
}
function bindMeter(){ meterOut(); }
function meterOut(){
  const m = S.money, inn = (+m.prijs||0)*(+m.aantal||0), w = inn-(+m.kosten||0);
  const o = document.getElementById('m-out'); if(!o) return;
  o.className = 'out'+(w<0?' neg':'');
  o.innerHTML = `<small>Winst per maand</small><b>€ ${w.toFixed(2).replace('.',',')}</b><small>${w<0?'Je verliest geld. Hogere prijs, meer klanten of minder kosten?':w===0?'Precies quitte. Nog niks over.':`Per jaar is dat ongeveer € ${Math.round(w*12)}.`}</small>`;
}

/* editor */
let edK = null;
function openEd(k){
  edK = k; const B = BLOCKS[k], notes = S.canvas[k]||[], i = ORDER.indexOf(k);
  const ex = EXAMPLE[k][0];
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edt" style="--g:var(--${B.g})">
    <div class="sh"><div><p class="tag">${GROUPNAME[B.g]} · vakje ${i+1} van 9</p><h2 id="edt">${B.name}</h2><p class="q">${B.q}</p></div><button class="x" data-act="close" aria-label="Sluiten">&times;</button></div>
    <div class="sb">
      <p>${B.uitleg}</p>
      <div class="tip"><b>Tip</b>${B.tip}<br><b>Voorbeeld</b>"${esc(ex)}" (bij bijles geven)</div>
      <div class="elist">${notes.length ? notes.map((n,j)=>`<span class="note" style="--n:var(--note-${B.g})">${esc(n)}<button data-act="del" data-v="${j}" aria-label="Verwijder ${esc(n)}">&times;</button></span>`).join('') : `<p class="empty">Nog geen plakbriefjes. Schrijf er hieronder één.</p>`}</div>
      <form class="addform" id="addform"><input class="field" id="noteinput" maxlength="80" autocomplete="off" placeholder="Schrijf kort, max 80 tekens" aria-label="Nieuw plakbriefje"><button class="btn" type="submit">Plak erop</button></form>
    </div>
    <div class="snav">
      <button class="btn ghost sm" data-act="ed" data-v="${ORDER[(i+8)%9]}">&larr; ${BLOCKS[ORDER[(i+8)%9]].name}</button>
      <button class="btn sm" data-act="ed" data-v="${ORDER[(i+1)%9]}">${BLOCKS[ORDER[(i+1)%9]].name} &rarr;</button>
    </div></div></div>`;
  m.hidden = false;
  setTimeout(()=>{ const f=document.getElementById('noteinput'); f && f.focus(); }, 30);
}
function closeEd(){ document.getElementById('modal').hidden = true; edK = null; render(); }

/* level 3 */
function vL3(){
  const d = misDone(), m = S.mis;
  const st = k => d.includes(k) ? '<span class="stamp">GEHAALD</span>' : '';
  const tot = m.ja+m.nee;
  let ih = '';
  if (tot>=5) ih = m.ja>=m.nee ? 'Goed teken! De meeste mensen zien het zitten. Vraag ze ook wat ze nóg beter zouden vinden.' : 'Veel nee\'s? Geen ramp. Vraag waaróm, en pas je idee aan. Dat doen echte ondernemers ook, het heet bijsturen.';
  const pr = Number(m.prijs), mine = Number(S.money.prijs);
  let ph = '';
  if (pr>0) ph = pr>=mine ? `Ze willen gemiddeld € ${pr} betalen, en jij vraagt € ${mine}. Misschien kun je zelfs iets meer vragen.` : `Ze willen € ${pr} betalen, maar jij vraagt € ${mine}. Kun je goedkoper werken, of meer waarde bieden?`;
  return `
  <p class="intro"><b>Plannen maken is stap één.</b> Echte ondernemers checken buiten of hun idee klopt, voordat ze geld uitgeven. Doe deze missies in het echt en vul in wat je ontdekt.</p>
  <div class="missions">
    <article class="mis ${d.includes('interview')?'done':''}">${st('interview')}
      <h3>Vraag 5 mensen: zou je dit kopen?</h3>
      <p>Leg "${esc(S.idea||'je idee')}" in één zin uit. Turf daarna het antwoord.</p>
      <div class="tally">
        <button class="btn green sm" data-act="tally" data-v="ja">+ Ja</button><span class="t" aria-label="Ja">${m.ja}</span>
        <button class="btn red sm" data-act="tally" data-v="nee">+ Nee</button><span class="t" aria-label="Nee">${m.nee}</span>
        <button class="btn ghost sm" data-act="tally" data-v="undo">Opnieuw</button>
      </div>
      ${ih?`<p class="hint">${ih}</p>`:`<p class="hint">Nog ${Math.max(0,5-tot)} te gaan.</p>`}
    </article>
    <article class="mis ${d.includes('prijs')?'done':''}">${st('prijs')}
      <h3>Wat hebben ze ervoor over?</h3>
      <p>Vraag niet "is €10 oké?", want dan zegt iedereen ja. Vraag: "Wat zou je ervoor betalen?" Vul het gemiddelde in.</p>
      <label for="mis-prijs" class="eyebrow" style="margin:0">Gemiddeld bedrag (€)</label>
      <input class="field" type="number" min="0" step="0.5" id="mis-prijs" data-mis="prijs" value="${esc(m.prijs)}">
      ${ph?`<p class="hint">${ph}</p>`:''}
    </article>
    <article class="mis ${d.includes('rivalen')?'done':''}">${st('rivalen')}
      <h3>Zoek 2 concurrenten</h3>
      <p>Wie doet al iets wat lijkt op jouw idee? Wat doen ze goed, en wat kan jij beter?</p>
      <input class="field" id="mis-r1" data-mis="r1" maxlength="80" placeholder="Concurrent 1, en wat ze goed doen" value="${esc(m.r1)}" aria-label="Concurrent 1">
      <input class="field" id="mis-r2" data-mis="r2" maxlength="80" placeholder="Concurrent 2, en wat ze goed doen" value="${esc(m.r2)}" aria-label="Concurrent 2">
    </article>
    <article class="mis ${d.includes('verras')?'done':''}">${st('verras')}
      <h3>Wat verraste je?</h3>
      <p>Schrijf op wat iemand zei waar jij nooit aan had gedacht. Moet je een vakje op je canvas aanpassen?</p>
      <textarea class="field" id="mis-verras" data-mis="verras" rows="3" maxlength="300" aria-label="Wat verraste je">${esc(m.verras)}</textarea>
    </article>
  </div>
  <p class="safety">Veilig op pad: praat met mensen die je kent, zoals klasgenoten, familie of buren. Wil je met onbekenden praten? Neem dan een ouder of docent mee.</p>`;
}

/* level 4 */
const flipped = new Set();
function vL4(){
  return `
  <p class="intro"><b>Grote bedrijven gebruiken vaak hetzelfde recept.</b> Draai een kaart om, lees het geheim, en bedenk hoe jij het zou gebruiken. Dan is de kaart van jou.</p>
  <div class="deck">${PATTERNS.map(p=>{ const got=S.pat[p.k], open=flipped.has(p.k)||got; const dr=S.patDraft[p.k]||got||'';
    return `<article class="pcard" id="pc-${p.k}">
      <div class="pfront" style="--pc:${p.c}"><span class="kind">${p.kind}</span><h3>${p.name}</h3><p><b>${p.line}</b></p><p class="brands">${p.brands}</p><svg class="shape" viewBox="0 0 62 62" aria-hidden="true">${p.shape}</svg></div>
      ${open ? `<div class="pback"><p>${p.uitleg}</p><p class="rq">${p.rq}</p>
        ${got ? `<p class="note" style="--n:var(--note-geld)">${esc(got)}</p>` : `<textarea class="field" rows="3" maxlength="200" id="pd-${p.k}" data-pat="${p.k}" aria-label="${esc(p.rq)}" placeholder="Mijn idee...">${esc(dr)}</textarea>`}</div>
        <div class="pfoot">${got ? `<span class="got">Verzameld</span>` : `<button class="btn sm" data-act="earn" data-v="${p.k}" id="pe-${p.k}" ${dr.trim().length<10?'disabled':''}>Kaart verdienen</button>`}</div>`
      : `<div class="pfoot" style="padding-top:16px"><button class="btn ghost sm" data-act="flip" data-v="${p.k}">Draai om</button></div>`}
    </article>`;}).join('')}</div>`;
}

/* level 5 */
let timer = {left:60,id:null,ran:false};
function vL5(){
  const c = S.canvas;
  const part = (k,cls='') => (c[k]&&c[k].length && !S.isExample) || (S.isExample && c[k]&&c[k].length)
    ? `<mark class="${cls}">${esc(c[k].join(' en ').replace(/^./,ch=>ch.toLowerCase()))}</mark>`
    : `<button class="gap" data-act="go-ed" data-v="${k}">vul "${BLOCKS[k].name}" in</button>`;
  return `
  <p class="intro"><b>Een pitch is je plan in een paar zinnen.</b> We hebben hem gemaakt uit jouw canvas. Lees hem hardop. Lukt het binnen 60 seconden, zonder te spieken?</p>
  ${S.isExample?`<p class="intro">Je ziet nu de pitch van het voorbeeld. Start in level 2 je eigen idee om je eigen pitch te krijgen.</p>`:''}
  <div class="pitch" id="pitchtext">
    <p>Hoi! Mijn bedrijf heet <b>${esc(S.idea||'...')}</b>.</p>
    <p>Ik help ${part('klanten')}.</p>
    <p>Wat ik voor ze oplos: ${part('waarde')}.</p>
    <p>Ze vinden me via ${part('kanalen')}, en ik houd ze blij met ${part('relatie')}.</p>
    <p>Ik verdien geld met ${part('inkomsten','geld')}. Mijn kosten zijn ${part('kosten','geld')}.</p>
    <p>Ik krijg hulp van ${part('partners','achter')}.</p>
  </div>
  <div class="stage">
    <div class="clock ${timer.left<=10&&timer.id?'hot':''}" id="clock" aria-live="off">0:${String(timer.left).padStart(2,'0')}</div>
    <button class="btn" data-act="timer">${timer.id?'Stop':'Start de klok'}</button>
    <button class="btn ghost" data-act="copy">Kopieer pitch</button>
    ${S.practiced ? `<span class="got">Pitch geoefend</span>` : `<button class="btn green" data-act="practiced" ${timer.ran?'':'disabled'}>Ik heb geoefend!</button>`}
  </div>`;
}
function tick(){
  timer.left--; const el=document.getElementById('clock');
  if (el){ el.textContent='0:'+String(Math.max(0,timer.left)).padStart(2,'0'); el.classList.toggle('hot',timer.left<=10); }
  if (timer.left<=0){ clearInterval(timer.id); timer.id=null; timer.ran=true; if(S.view==='l5') render(); toast('<span>Tijd!</span> Hoe ging het?'); }
}

/* ---------- acties ---------- */
const ACT = {
  go(t){ S.view=t.dataset.v; sel=null; fb={t:'',c:''}; resetArm=false; save(); render(); window.scrollTo({top:0}); },
  brand(t){ S.l1brand=t.dataset.v; sel=null; fb={t:'',c:''}; save(); render(); },
  pick(t){ const k=t.dataset.v; sel = sel===k?null:k; fb={t:'',c:''}; render(); },
  blk(t){
    const k=t.dataset.k;
    if (S.view==='l2') return openEd(k);
    if (S.view!=='l1') return;
    const b=S.l1brand;
    if (!sel){ fb={t:'Kies eerst een kaartje hieronder.',c:''}; render(); return; }
    if (sel===k){
      S.l1[b][k]=true; sel=null; fb={t:`Ja! Dat hoort bij ${BLOCKS[k].name}.`,c:'good'};
      save(); render(); award(`l1-${b}-${k}`,5,BLOCKS[k].name);
      document.querySelector(`.blk[data-k="${k}"]`)?.classList.add('pop');
      if (Object.keys(S.l1[b]).length===9){ award(`l1-${b}`,30,`${BRANDS[b].name} ontleed`); confetti(); render(); }
    } else {
      fb={t:`Nog niet. Dit vakje vraagt: "${BLOCKS[k].q}" Past je kaartje daarbij?`,c:'bad'};
      render(); document.querySelector(`.blk[data-k="${k}"]`)?.classList.add('shake');
    }
  },
  ed(t){ openEd(t.dataset.v); },
  'go-ed'(t){ S.view='l2'; save(); render(); openEd(t.dataset.v); },
  close(){ closeEd(); },
  'close-bg'(t,e){ if (e.target===t) closeEd(); },
  del(t){ S.canvas[edK].splice(+t.dataset.v,1); save(); openEd(edK); },
  arm(){ resetArm=true; render(); },
  unarm(){ resetArm=false; render(); },
  reset(){ S.canvas={}; ORDER.forEach(k=>S.canvas[k]=[]); S.idea=''; S.isExample=false; resetArm=false; save(); render(); toast('<span>Leeg canvas!</span> Begin bij Klanten.'); document.getElementById('idea')?.focus(); },
  tally(t){ const v=t.dataset.v; if(v==='undo'){S.mis.ja=0;S.mis.nee=0;} else S.mis[v]++; save(); checkMis(); render(); },
  flip(t){ flipped.add(t.dataset.v); render(); document.getElementById('pc-'+t.dataset.v)?.classList.add('flip'); setTimeout(()=>document.getElementById('pd-'+t.dataset.v)?.focus(),50); },
  earn(t){ const k=t.dataset.v, v=(S.patDraft[k]||'').trim(); if(v.length<10) return; S.pat[k]=v; save(); award('pat-'+k,20,PATTERNS.find(p=>p.k===k).name+' verzameld'); if(Object.keys(S.pat).length===5) confetti(); render(); },
  timer(){ if(timer.id){ clearInterval(timer.id); timer.id=null; timer.ran=true; } else { timer.left=60; timer.id=setInterval(tick,1000); } render(); },
  practiced(){ S.practiced=true; save(); award('pitch',50,'Pitch geoefend'); confetti(); render(); },
  copy(){
    const txt = document.getElementById('pitchtext').innerText.replace(/vul "[^"]+" in/g,'...');
    navigator.clipboard.writeText(txt).then(()=>toast('<span>Gekopieerd!</span>')).catch(()=>{
      const r=document.createRange(); r.selectNodeContents(document.getElementById('pitchtext'));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Tekst geselecteerd, kopieer met Ctrl+C');
    });
  },
};
function checkMis(){
  const names={interview:'Interviews gedaan',prijs:'Prijs gecheckt',rivalen:'Concurrenten gevonden',verras:'Inzicht genoteerd'};
  misDone().forEach(k=>{ if(award('mis-'+k,25,names[k]) && misDone().length===4) confetti(); });
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const f = ACT[t.dataset.act]; if (f) f(t,e);
});
document.addEventListener('submit', e=>{
  if (e.target.id!=='addform') return; e.preventDefault();
  const inp=document.getElementById('noteinput'), v=inp.value.trim(); if(!v||!edK) return;
  (S.canvas[edK] ||= []).push(v.slice(0,80)); save();
  const k=edK; render(); openEd(k);
  award('canvas-'+k,15,BLOCKS[k].name+' ingevuld');
  if (!S.isExample && filled()===9) { award('canvas-all',40,'Canvas compleet!'); confetti(); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if (t.dataset.bind==='idea'){ S.idea=t.value; save(); }
  if (t.dataset.m){ S.money[t.dataset.m]=t.value; save(); meterOut(); award('meter',20,'Geldmeter gebruikt'); }
  if (t.dataset.mis){ S.mis[t.dataset.mis]=t.value; save(); }
  if (t.dataset.pat){ S.patDraft[t.dataset.pat]=t.value; save(); const b=document.getElementById('pe-'+t.dataset.pat); if(b) b.disabled = t.value.trim().length<10; }
});
document.addEventListener('change', e=>{
  if (e.target.dataset.mis) setTimeout(()=>{ const id=document.activeElement && document.activeElement.id; checkMis(); render(); if(id) document.getElementById(id)?.focus(); },0);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !document.getElementById('modal').hidden) closeEd(); });

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FF5B3A','#FFC83D','#2CCB86','#3E95FF','#C9A7FF','#FF8FC1'];
  const P=Array.from({length:120},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;
  (function step(){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
    if (++f<110) requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

header(); render();
</script>

</body></html>
